name: Arduino Library CI

on: [pull_request, push, repository_dispatch]

jobs:
  regression-tests:
    name: All regression tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: adafruit/Adafruit_GPS
        ref: 1.9.0
        path: gps-dependency
    - uses: actions/checkout@v4
      with:
        repository: adafruit/Adafruit_TestHarness
        ref: 99baaab796be9420a83c7d74a2be1404c29bc25b
        path: test-harness
    - name: Run all tests with sanitizers
      run: python3 extras/tests/run_tests.py --gps-dir gps-dependency --harness-dir test-harness

  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - uses: actions/checkout@v3
    - uses: actions/checkout@v3
      with:
         repository: adafruit/ci-arduino
         path: ci

    - name: Install the prerequisites
      run: bash ci/actions_install.sh

    - name: Check for correct code formatting with clang-format
      run: python3 ci/run-clang-format.py -e "ci/*" -e "bin/*" -r .

    - name: Check for correct documentation with doxygen
      env:
        GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        PRETTYNAME : "Adafruit uBlox Library"
      run: bash ci/doxy_gen_and_deploy.sh

    - name: Test the code on supported platforms
      run: |
        arduino-cli lib update-index
        arduino-cli lib install "Adafruit GPS Library@1.9.0"
        # ci-arduino does not parse dependency version constraints. Keep the
        # published requirement; normalize only this runner's working copy.
        sed -i 's/Adafruit GPS Library (>=1.9.0)/Adafruit GPS Library/' library.properties
        python3 ci/build_platform.py main_platforms
